name: macropage-crm

services:
  mongo:
    image: mongo:7
    container_name: macropage-mongo
    # Single-node replica set: required for multi-document transactions.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    # Initiates rs0 on first boot (idempotent), then reports healthy once a primary exists.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status().ok } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok
          };
          db.hello().isWritablePrimary ? quit(0) : quit(1)
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Optional web UI: `docker compose --profile tools up -d` → http://localhost:8081
  mongo-express:
    image: mongo-express:1
    container_name: macropage-mongo-express
    profiles: ["tools"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    restart: unless-stopped

volumes:
  mongo-data:
